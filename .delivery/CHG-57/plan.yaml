change_id: CHG-57
route: Standard Change
prohibited_paths:
  - recorder/
  - tests/
  - web/
  - .github/
  - requirements.txt
checkpoints:
  - id: strong-copyleft-license
    allowed_paths:
      - LICENSE
      - README.md
      - .delivery/CHG-57/
    test_paths:
      - tests/
    tests:
      - id: full-regression
        command: [python, -m, unittest, discover, -s, tests, -v]
        timeout_seconds: 240
