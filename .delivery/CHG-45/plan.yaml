change_id: CHG-45
route: Standard Change
prohibited_paths:
  - .github/
  - user-history/
  - secrets/
checkpoints:
  - id: phase-one-recorder
    allowed_paths:
      - recorder/app.py
      - recorder/store.py
      - recorder/folders.py
      - recorder/excel.py
      - recorder/handover.py
      - recorder/notes_window.py
      - web/index.html
